# CI mínimo: formato + tests unitarios del workspace (sin servicios externos).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: cargo test (workspace, default features)
        run: cargo test --workspace --all-targets

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  desktop:
    name: Tauri check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/jaiba-ui/src-tauri

      - name: Build and stage sidecar
        run: |
          cargo build -p jaiba-cli --bin jaiba
          bash scripts/prepare-desktop-sidecar.sh

      - name: Check Tauri shell
        run: cargo check --manifest-path apps/jaiba-ui/src-tauri/Cargo.toml

  ui:
    name: UI typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/jaiba-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/jaiba-ui/package-lock.json

      - name: npm ci
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: production build
        run: npm run build
