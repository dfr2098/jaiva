# Publica binario Linux, jaiba.exe + instalador desktop de Windows e imagen
# Docker `jaiba-serve` en tags v*.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (solo workflow_dispatch; p. ej. v0.2.1)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: jaiba-serve

jobs:
  binary:
    name: Linux binary (release-core)
    # El binario enlaza la glibc del runner: 22.04 (2.35) permite ejecutarlo en
    # Debian 12, Ubuntu 22.04+ y RHEL 9+; con ubuntu-latest exigiría 2.39.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Node.js (consola incrustada)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/jaiba-ui/package-lock.json

      - name: Build consola
        working-directory: apps/jaiba-ui
        run: npm ci && npm run build

      - name: Build
        run: |
          cargo build --release -p jaiba-cli --features release-core,oracle-driver,embedded-ui --bin jaiba
          strip target/release/jaiba
          tar -czf "jaiba-linux-x86_64.tar.gz" -C target/release jaiba -C "$GITHUB_WORKSPACE" LICENSE THIRD_PARTY_LICENSES.md
          shasum -a 256 jaiba-linux-x86_64.tar.gz > jaiba-linux-x86_64.sha256

      - name: Smoke del binario publicado
        run: |
          ./target/release/jaiba examples/smoke.yaml
          ./target/release/jaiba oracle-client status
          JAIBA_ADMIN_AUTH=none JAIBA_SERVER_ADDR=127.0.0.1:19090 ./target/release/jaiba serve &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:19090/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:19090/ | grep -q __JAIBA_API_BASE__
          kill %1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaiba-linux-x86_64
          path: |
            jaiba-linux-x86_64.tar.gz
            jaiba-linux-x86_64.sha256

  image:
    name: Docker jaiba-serve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.jaiba-serve
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows:
    name: Windows
    uses: ./.github/workflows/windows.yml

  github-release:
    name: GitHub Release
    needs: [binary, image, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: jaiba-linux-x86_64

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: jaiba-windows-x86_64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            jaiba-linux-x86_64.tar.gz
            jaiba-linux-x86_64.sha256
            jaiba-windows-x86_64.zip
            jaiba-desktop-windows-x86_64-setup.exe
            jaiba-windows-x86_64.sha256
          body: |
            > **¿Actualizas desde una versión anterior?** Revisa las
            > [notas de actualización](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/actualizar.md):
            > lista los cambios que obligan a revisar flows existentes.

            ## Windows 10/11 (x64)

            - **App de escritorio:** `jaiba-desktop-windows-x86_64-setup.exe`. Instala
              Jaiba con su motor incluido (**Motor → Local → Arrancar**).
            - **Solo el motor:** `jaiba-windows-x86_64.zip` con `jaiba.exe`; en PowerShell
              `$env:JAIBA_ADMIN_AUTH="none"; .\jaiba.exe serve` y abre http://127.0.0.1:9090/.

            Ambos traen todos los conectores: PostgreSQL, MySQL/MariaDB, SQLite, archivos,
            Oracle, SQL Server, MongoDB, Kafka y ClickHouse. Para Oracle instala además
            [Oracle Instant Client](https://www.oracle.com/database/technologies/instant-client/winx64-64-downloads.html)
            64-bit y agrega su carpeta al `PATH`. El instalador no está firmado: si
            Windows muestra "Windows protegió su PC", elige **Más información →
            Ejecutar de todas formas**.

            ## Instalar (Linux x86_64, glibc 2.35+)

            ```bash
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/jaiba-linux-x86_64.tar.gz
            tar xzf jaiba-linux-x86_64.tar.gz
            JAIBA_ADMIN_AUTH=none ./jaiba serve   # prueba local: consola en http://127.0.0.1:9090/
            ./jaiba validate flujo.yaml           # revisar un flujo sin ejecutarlo
            ```

            La consola web va incluida: abre http://127.0.0.1:9090/ en el navegador.
            `JAIBA_ADMIN_AUTH=none` solo se acepta en loopback; con
            `JAIBA_ADMIN_TOKEN` pega el token en **Acceso** de la consola.
            Incluye PostgreSQL, MySQL/MariaDB, SQLite, Oracle y archivos. Para Oracle,
            `./jaiba oracle-client install` descarga Instant Client (versión y SHA-256
            fijos) y Jaiba lo usa sin configurar `LD_LIBRARY_PATH`. En Linux,
            SQL Server, MongoDB, Kafka y ClickHouse requieren compilar con
            `--features all-drivers` (los builds de Windows ya los traen).

            ## Artefactos
            - Binario Linux x86_64 (`release-core` + Oracle): `jaiba-linux-x86_64.tar.gz`
            - Imagen: `ghcr.io/${{ github.repository_owner }}/jaiba-serve:${{ github.ref_name }}`

            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/jaiba-serve:${{ github.ref_name }}
            docker run --rm -p 127.0.0.1:9090:9090 \
              -e JAIBA_MASTER_KEY=change-me \
              -e JAIBA_ADMIN_TOKEN=change-me \
              ghcr.io/${{ github.repository_owner }}/jaiba-serve:${{ github.ref_name }}
            # consola en http://127.0.0.1:9090/ (token en "Acceso")
            ```
