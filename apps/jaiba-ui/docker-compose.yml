name: visualisa_jaiva

services:
  visualisa-jaiva:
    build:
      context: .
    container_name: visualisa_jaiva
    restart: unless-stopped
    ports:
      - "127.0.0.1:9080:9080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      VISUALISA_PORT: "9080"
      JAIBA_API_UPSTREAM: "${JAIBA_API_UPSTREAM:-http://host.docker.internal:9090}"
      JAIVA_API_UPSTREAM: "${JAIBA_API_UPSTREAM:-http://host.docker.internal:9090}"
      NGINX_ENVSUBST_FILTER: "VISUALISA_PORT|JAIBA_API_UPSTREAM|JAIVA_API_UPSTREAM"
