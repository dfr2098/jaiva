[package]
name = "jaiba-cli"
description = "Consola de Jaiba y comando compatible jaiva-flow"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "jaiva-flow"

[features]
default = []
# Perfil de release mínima: sin drivers opcionales (Postgres/SQLite van en el runtime base).
# Uso: `cargo test -p jaiba-cli --features release-core` / `scripts/smoke-release-core.sh`
release-core = []
# Todos los conectores opcionales (p. ej. sidecar del desktop: `npm run desktop:build:full`).
# Oracle necesita Instant Client al ejecutar; Kafka necesita CMake al compilar.
all-drivers = [
    "oracle-driver",
    "sqlserver-driver",
    "kafka-driver",
    "mongodb-driver",
    "clickhouse-driver",
]
oracle-driver = ["jaiba-runtime/oracle-driver", "jaiba-server/oracle-driver"]
sqlserver-driver = ["jaiba-runtime/sqlserver-driver", "jaiba-server/sqlserver-driver"]
kafka-driver = ["jaiba-runtime/kafka-driver", "jaiba-server/kafka-driver"]
mongodb-driver = ["jaiba-runtime/mongodb-driver", "jaiba-server/mongodb-driver"]
clickhouse-driver = ["jaiba-runtime/clickhouse-driver", "jaiba-server/clickhouse-driver"]
# Consola web dentro del binario (requiere `npm run build` en apps/jaiba-ui).
embedded-ui = ["jaiba-server/embedded-ui"]

[dependencies]
jaiba-core = { path = "../jaiba-core" }
jaiba-runtime = { path = "../jaiba-runtime" }
jaiba-server = { path = "../jaiba-server" }
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
tracing.workspace = true

[[bin]]
name = "jaiba"
path = "src/bin/jaiba.rs"

[[bin]]
name = "jaiva-flow"
path = "src/bin/jaiva-flow.rs"
