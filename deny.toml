# cargo-deny: el CI corre `cargo deny check licenses` en cada PR, para el motor y
# para el escritorio (--manifest-path apps/jaiba-ui/src-tauri/Cargo.toml).
# Mantener `allow` alineado con `accepted` de about.toml.

[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "UPL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "MIT-0",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"
