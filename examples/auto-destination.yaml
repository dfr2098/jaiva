id: auto-destination-example

database_connections:
  destination:
    type: postgres
    url_env: DATABASE_URL
    max_connections: 5

engine:
  repository:
    enabled: true
    database_path: .jaiva/auto-destination-repository.db
    content_path: .jaiva/auto-destination-content
    abandoned_after_seconds: 0
    completed_retention_hours: 24

processors:
  - id: records
    type: generate_records
    config:
      records:
        - id: 1
          name: Ada
        - id: 2
          name: Linus

  - id: destination
    type: auto_destination
    config:
      connection: destination
      table: public.jaiva_write_example
      mode: auto
      batch_size: 1000
      columns:
        id: id
        name: name
      conflict_columns:
        - id

  - id: errors
    type: log_records

connections:
  - from: records
    relationship: success
    to: destination

  - from: destination
    relationship: failure
    to: errors
