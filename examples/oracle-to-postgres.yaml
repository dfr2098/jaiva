id: oracle-to-postgres-test

# Las contraseñas nunca se escriben en YAML. El script exporta estas variables
# únicamente durante la ejecución del proceso Jaiba.
database_connections:
  source:
    type: oracle
    url_env: ORACLE_DATABASE_URL
    max_connections: 1
  destination:
    type: postgres
    url_env: DATABASE_URL
    max_connections: 5

engine:
  queue_capacity: 100
  max_concurrency: 4
  repository:
    enabled: true
    database_path: .jaiva/repository.db
    content_path: .jaiva/content
    abandoned_after_seconds: 0
    completed_retention_hours: 24

processors:
  # DUAL permite probar la extracción sin crear ni modificar tablas en Oracle.
  - id: read_oracle
    type: query_oracle
    config:
      connection: source
      query: >-
        SELECT 1001 AS ID,
               'Fila 1 desde Oracle' AS NAME,
               TO_CHAR(SYSTIMESTAMP, 'YYYY-MM-DD"T"HH24:MI:SS.FF3TZH:TZM') AS LOADED_AT
        FROM DUAL
        UNION ALL
        SELECT 1002 AS ID,
               'Fila 2 desde Oracle' AS NAME,
               TO_CHAR(SYSTIMESTAMP, 'YYYY-MM-DD"T"HH24:MI:SS.FF3TZH:TZM') AS LOADED_AT
        FROM DUAL
      batch_size: 100

  - id: load_postgres
    type: auto_destination
    config:
      connection: destination
      table: public.jaiva_oracle_load_test
      mode: auto
      batch_size: 100
      columns:
        # query_oracle normaliza ID/NAME/LOADED_AT a minúsculas.
        id: id
        name: name
        loaded_at: loaded_at
      conflict_columns:
        # Esta clave hace que mode:auto seleccione un upsert.
        - id
    retry:
      maximum_attempts: 3
      initial_delay_ms: 250
      maximum_delay_ms: 5000

  - id: errors
    type: log_records

connections:
  # Success mueve los lotes; failure centraliza los diagnósticos.
  - from: read_oracle
    relationship: success
    to: load_postgres
  - from: read_oracle
    relationship: failure
    to: errors
  - from: load_postgres
    relationship: failure
    to: errors
