id: oracle-write-example

database_connections:
  destination:
    type: oracle
    url_env: ORACLE_DATABASE_URL
    max_connections: 1

engine:
  repository:
    enabled: true
    database_path: .jaiva/repository.db
    content_path: .jaiva/content
    abandoned_after_seconds: 0
    completed_retention_hours: 24

processors:
  - id: records
    type: generate_records
    config:
      records:
        - id: 1
          name: Ada
        - id: 2
          name: Linus

  - id: destination
    type: put_database
    config:
      connection: destination
      table: DMA_TEST.JAIVA_WRITE_EXAMPLE
      mode: upsert
      batch_size: 1000
      columns:
        id: ID
        name: NAME
      conflict_columns:
        - ID
    retry:
      maximum_attempts: 3
      initial_delay_ms: 250
      maximum_delay_ms: 5000

  - id: errors
    type: log_records

connections:
  - from: records
    relationship: success
    to: destination
  - from: destination
    relationship: failure
    to: errors
