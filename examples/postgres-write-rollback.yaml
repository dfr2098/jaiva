id: postgres-write-rollback-example

database_connections:
  destination:
    type: postgres
    url_env: DATABASE_URL
    max_connections: 5

engine:
  repository:
    enabled: false

processors:
  - id: records
    type: generate_records
    config:
      records:
        - id: 10
          name: Valid before rollback
        - id: not-an-integer
          name: Invalid value

  - id: destination
    type: put_database
    config:
      connection: destination
      table: public.jaiva_write_example
      mode: insert
      batch_size: 1
      columns:
        id: id
        name: name

  - id: errors
    type: log_records

connections:
  - from: records
    relationship: success
    to: destination
  - from: destination
    relationship: failure
    to: errors
